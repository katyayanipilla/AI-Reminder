<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In — AI Medicine Reminder</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="card" style="max-width:440px; width:100%;">
    <div style="font-size:2.2rem;">💊</div>
    <h1>Welcome back</h1>
    <p>Log in to see today's medicines and reminders.</p>
    <div id="form-alert"></div>
    <form id="login-form">
      <div class="field">
        <label for="identifier">Email or Phone</label>
        <input type="text" id="identifier" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Log In</button>
    </form>
    <p style="text-align:center; margin-top:16px;">New here? <a href="/register.html">Create an account</a></p>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
