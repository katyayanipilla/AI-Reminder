<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reminders — AI Medicine Reminder</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page-shell">
  <nav class="navbar" id="navbar"></nav>
  <main>
    <div class="container">
      <h1>Today's Reminders</h1>
      <div class="card">
        <div id="reminders-list"></div>
      </div>

      <div class="card">
        <h2>Demo Mode</h2>
        <p>For a quick expo/college demo: load sample medicines, or fire a test reminder in a
           minute or two to show the full notification → confirmation flow live.</p>
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px;">
          <button class="btn btn-secondary" id="seed-btn" type="button">Load Sample Patient Data</button>
        </div>
        <fieldset>
          <legend>Test Reminder in…</legend>
          <div class="chip-group" id="test-minutes">
            <button class="chip active" data-min="1" type="button">1 minute</button>
            <button class="chip" data-min="2" type="button">2 minutes</button>
            <button class="chip" data-min="5" type="button">5 minutes</button>
          </div>
        </fieldset>
        <button class="btn btn-primary" id="test-reminder-btn" type="button">Schedule Test Reminder</button>
        <p id="test-reminder-status" class="field-hint" style="margin-top:10px;"></p>
      </div>
    </div>
  </main>
  <footer class="site-footer">AI Medicine Reminder — college project demo</footer>
</div>
<script src="/js/app.js"></script>
<script src="/js/reminders.js"></script>
</body>
</html>
